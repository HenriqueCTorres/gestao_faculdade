<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('Tela de Edição do Discente')}" />
  <body>
    <div class="container">
        <div class="row">
            <h1>Editar Discente</h1>
        </div>
        <div class="row">
            
            <form th:object="${discente}" th:action="@{/discente/atualizar/{idDiscente}(idDiscente = ${discente.id})}" method="post">
            
            RM: <input class="form-control" type="text" th:field="*{rm}"
            th:errorclass="is-invalid"><br>
            <div class="invalid-feedback" th:errors="*{rm}"></div><br>
            
            E-mail Institucional: 
            <input class="form-control" type="text" th:field="*{emailInstitucional}"><br>
            
            Status:
            <select class="form-select" th:field="*{status}">
            	<option th:each="status : ${lista_status}" th:value="${status}" 
            	th:text="${status.descricao}" />
            </select><br>
            
            Nível:
            <select class="form-select" th:field="*{nivel}">
            	<option th:each="nivel : ${lista_niveis}" th:value="${nivel}" 
            	th:text="${nivel.descricao}" />
            </select><br>
            
            Nome: <input class="form-control" type="text" th:field="*{pessoa.nome}"
            th:errorclass="is-invalid"><br>
            <div class="invalid-feedback" th:errors="*{pessoa.nome}"></div><br>
            
            CPF: <input class="form-control" type="text" th:field="*{pessoa.cpf}"
            th:errorclass="is-invalid"><br>
            <div class="invalid-feedback" th:errors="*{pessoa.cpf}"></div><br>
            
            E-mail Pessoal: <input class="form-control" type="text" 
            th:field="*{pessoa.email}" th:errorclass="is-invalid"><br>
            <div class="invalid-feedback" th:errors="*{pessoa.email}"></div><br>
            
            Telefone: <input class="form-control" type="text" th:field="*{pessoa.telefone}"><br>
            
            Data de Nascimento: <input class="form-control" type="date" 
            th:field="*{pessoa.dataNascimento}" th:errorclass="is-invalid"><br>
            <div class="invalid-feedback" th:errors="*{pessoa.dataNascimento}"></div><br>
            
            Nacionalidade:
            <select class="form-select" th:field="*{pessoa.nacionalidade}">
            	<option th:each="nac : ${lista_nacionalidades}" th:value="${nac}"
            	 th:text="${nac.descricao}" />
            </select><br>
            
            <button type="submit">Editar</button>
            
            </form>

        </div>
        <div class="row">
            <a href="/home">Home Page</a>
        </div>
    </div>
    
    
    <script th:replace="~{fragmentos :: bootstrap-script}" />

    </body>
</html>
