<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">

    <title>Tela de Edição de Discentes</title>
  </head>
  <body>
    <div class="container">
        <div class="row">
            <h1>Editar Discente</h1>
        </div>
        <div class="row">
            
            <form th:object="${discente}" th:action="@{/discente/atualizar/{idDiscente}(idDiscente = ${discente.id})}" method="post">
            
            Nome: <input class="form-control" type="text" th:field="*{pessoa.nome}"><br>
            
            CPF: <input class="form-control" type="text" th:field="*{pessoa.cpf}"><br>
            
            E-mail: <input class="form-control" type="text" th:field="*{pessoa.email}"><br>
            
            Telefone: <input class="form-control" type="text" th:field="*{pessoa.telefone}"><br>
            
            Data de Nascimento: <input class="form-control" type="date" 
            th:field="*{pessoa.dataNascimento}"><br>
            
            Nacionalidade:
            <select class="form-select" th:field="*{nacionalidade}">
            	<option th:each="nac : ${nacionalidades}" th:value="${nac}"
            	 th:text="${nac.descricao}" />
            </select><br>
            
            <button type="submit">Cadastrar</button>
            
            </form>

        </div>
        <div class="row">
            <a href="/home">Home Page</a>
        </div>
    </div>

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW" crossorigin="anonymous"></script>
  </body>
</html>
